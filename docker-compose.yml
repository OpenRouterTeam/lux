version: '3'
services:
  elixir:
    image: elixir:1.18
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ALCHEMY_API_KEY=test-alchemy-key
      - OPENAI_API_KEY=test-openai-key
      - OPENWEATHER_API_KEY=test-openweather-key
      - OPENROUTER_API_KEY=${OpenRouter_AI_s_API_key}
      - TRANSPOSE_API_KEY=test-transpose-key
      - INTEGRATION_TRANSPOSE_API_KEY=test-integration-transpose-key
      - INTEGRATION_OPENAI_API_KEY=test-integration-openai-key
      - INTEGRATION_OPENWEATHER_API_KEY=test-integration-openweather-key
      - HYPERLIQUID_PRIVATE_KEY=0xdeadbeef
      - HYPERLIQUID_ADDRESS=0xdeadbeef
      - HYPERLIQUID_API_URL=https://api.hyperliquid-testnet.xyz
      - RPC_URL=https://eth-mainnet.g.alchemy.com/v2/test-alchemy-key
      - WALLET_ADDRESS=0xdeadbeef
      - WALLET_PRIVATE_KEY=0xdeadbeef
    command: bash -c "apt-get update && apt-get install -y nodejs npm && mix local.hex --force && mix local.rebar --force && mix deps.get && mix test.unit test/unit/lux/llm/open_router_test.exs"
